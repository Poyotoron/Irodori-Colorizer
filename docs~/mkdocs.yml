site_name: Irodori Colorizer
site_url: https://ghp.maaaaa.net/Irodori-Colorizer/
repo_url: https://github.com/Poyotoron/Irodori-Colorizer
site_dir: site

theme:
  name: material
  language: ja
  custom_dir: overrides
  # サイト共通のファビコン。実体は www.maaaaa.net 側にあり、そちらを差し替えれば全ツールに反映される
  favicon: https://www.maaaaa.net/favicon.png
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークテーマに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトテーマに切り替える

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  irodori_version: !ENV [IRODORI_VERSION, dev]

nav:
  - はじめに: index.md
  - インストール: install.md
  - クイックスタート: quickstart.md
  - ラベルを付ける: labels.md
  - プリセット: presets.md
  - 設定: settings.md
  - 色の付き方: behavior.md
  - 困ったときは: troubleshooting.md
  - 更新履歴: changelog.md
